pytest:
  image: python:3.12
  stage: test
  script:
    - curl -LsSf https://astral.sh/uv/install.sh | sh
    - export PATH="$HOME/.local/bin:$PATH"
    - uv sync
    - uv run pytest --cov -v --junitxml=test-results.xml
  artifacts:
    paths:
      - htmlcov/
    reports:
      junit: test-results.xml
  only:
    - main

