bump_version_and_tag_test:
  stage: version
  image: python:3.12
  before_script:
    - apk add --no-cache git 
    - git config --global user.name "GitLab CI/CD Test"
    - git config --global user.email "gitlab-ci-test@email.com"
    - git remote set-url origin https://gitlab+deploy-token:${GITLAB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git  
  script:
    - echo "Current branch: $(git branch --show-current)"   
    - VERSION=$(uv version --short)
    - echo "Current version: $VERSION"    
    - echo "Dry-run: uv version --bump ${VERSION_TYPE:-patch}"  
    - uv version --dry-run --bump ${VERSION_TYPE:-patch}
    - NEW_VERSION=$(uv version --short) 
    - echo "Would commit version bump for $NEW_VERSION"
    - echo "Would push commit to main: git push origin main"
    - echo "Would create tag: git tag v$NEW_VERSION"
    - echo "Would push tag: git push origin v$NEW_VERSION"
  needs:
    - pytest
    - build_docs_site
  only:
    - ci-test  
