[project]
name = "pytweezers-tools"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jupyterlab>=4.3.5",
    "matplotlib>=3.10.0",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.6.14",
    "numpy>=2.2.3",
    "pandas>=2.2.3",
    "pyyaml>=6.0.2",
    "scipy>=1.15.2",
    "seaborn>=0.13.2",
    "toml>=0.10.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-cov>=6.0.0",
]

[tool.pytest.ini_options]
pythonpath = "src"

[tool.coverage.report]
exclude_lines = [
    "if TYPE_CHECKING:" , #ignores the 'if TYPE_CHECKING' blocks in the coverage report,
    "@abstractmethod"
]
